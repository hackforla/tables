name: Weekly Clasp Token Update

on:
  schedule:
    - cron: '0 12 * * 1' # Runs every Monday at 12:00 UTC
  workflow_dispatch: # Allows manual triggering

# Restrict GITHUB_TOKEN permissions
permissions:
  contents: read
  actions: read

jobs:
  weekly-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Removed 'ref' to checkout the triggering branch (e.g., main or 95-github-action-pre-push-hook)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write CLASP_CREDENTIALS secret to .clasprc.json file
        run: |
          echo "${{ secrets.CLASPRC_JSON }}" > "${HOME}/.clasprc.json"
          # Verify the file is valid JSON
          jq . "${HOME}/.clasprc.json" || { echo "Invalid JSON in .clasprc.json"; exit 1; }
          # Overwrite file to minimize exposure
          echo "{}" > "${HOME}/.clasprc.json

      - name: Check clasp login status
        id: clasp_login
        run: clasp login --status || { echo "Clasp login check failed"; exit 1; }

      - name: Save current .clasprc.json contents to CLASPRC_JSON_FILE environment variable
        id: save-clasprc
        run: |
          echo ::add-mask::$(tr -d '\n\r' < ~/.clasprc.json)
          echo "CLASPRC_JSON_FILE=$(tr -d '\n\r' < ~/.clasprc.json)" >> $GITHUB_ENV     

      - name: Update CLASP_CREDENTIALS secret
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          CLASP_CREDENTIALS_CURRENT: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          if [ "$CLASPRC_JSON_FILE" != "$CLASP_CREDENTIALS_CURRENT" ]; then
            echo "$CLASPRC_JSON_FILE" | gh secret set CLASP_CREDENTIALS --repo ${{ github.repository }}
            echo "Updated CLASP_CREDENTIALS secret"
          else
            echo "No update needed for CLASP_CREDENTIALS"
          fi
          # Clean up sensitive file
          rm "${HOME}/.clasprc.json"