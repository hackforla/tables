name: Replace Apps Script Environment
on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: boolean
        description: Confirm removing environment variables

jobs:
  replaceAppsScriptEnv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clasprcJSON: ${{ secrets.CLASPRC_JSON }}
          scriptId: ${{ env.SCRIPT_ID }}
      - uses: ./.github/actions/replace_appsscript_env
        with:
          newEnv: ${{ toJSON(secrets) }}
          confirmation: ${{ inputs.confirmation }}
      - uses: ./.github/action/update_secret
        with:
          currentCred: ${{ secrets.CLASPRC_JSON }}
          githubKey: ${{ github.token }}
          repoName: ${{ github.repository }}
