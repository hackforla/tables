name: Replace Apps Script Environment
on:
  push:
    inputs:
      confirmation:
        type: boolean
        description: Confirm removing environment variables

jobs:
  replaceAppsScriptEnv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/replace_appsscript_env
        with:
          # JSON Objects can not be passed, so it must be converted to a string first.
          newEnv: ${{ toJSON(secrets) }}
          confirmation: ${{ inputs.confirmation }}
      - uses: ./.github/actions/update_secret
        with:
          currentCred: ${{ secrets.CLASPRC_JSON }}
          path: "~/.clasprc"
          secretName: "CLASPRC_JSON"
          githubKey: ${{ github.token }}
          githubPublicKey: ${{ secrets.PUBLIC_KEY_GITHUB }}
          repoName: ${{ github.repository }}
      - uses: ./.github/actions/update_secret
        with:
          currentCred: ${{ secrets.CLASPRC_JSON }}
          path: "./.clasprc"
          secretName: "CLASPRC_JSON_RUN"
          githubKey: ${{ github.token }}
          githubPublicKey: ${{ secrets.PUBLIC_KEY_GITHUB }}
          repoName: ${{ github.repository }}
