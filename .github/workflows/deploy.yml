name: Deploy Script

on:
  push:
    branches:
      - main
      - 95-github-action-pre-push-hook # For testing only
  workflow_dispatch: # Allows manual triggering for testing

# Restrict GITHUB_TOKEN permissions
permissions:
  contents: read
  actions: read

jobs:
  clasp-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        # Pinned to specific SHA for security

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@6c4d7e9e3b7a36685a48b814d48eb136af31f297 # v45.0.2
        # Pinned to specific SHA for security

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '16'

      - name: Install clasp
        id: install-clasp
        run: npm install -g @google/clasp # Removed sudo for compatibility

      - name: Write CLASP_CREDENTIALS secret to .clasprc.json
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          echo "$CLASP_CREDENTIALS" > "${HOME}/.clasprc.json"
          # Validate JSON to ensure integrity
          jq . "${HOME}/.clasprc.json" || { echo "Invalid JSON in .clasprc.json"; exit 1; }
          # Overwrite file to minimize exposure
          echo "{}" > "${HOME}/.clasprc.json"

      - name: Make clasp_push.sh executable
        run: chmod +x ./.github/scripts/clasp_push.sh

      - name: Run clasp_push.sh
        id: run-clasp-push
        run: |
          if [ -z "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
            echo "No changes to push."
          else
            ./.github/scripts/clasp_push.sh ${{ steps.changed-files.outputs.all_changed_files }}
          fi
