name: "Setup"
description: "Initial Setup for Apps Script"
inputs:
  clasprcJson:
    description: "Clasp Auth File"
    required: true
  scriptId:
    description: "Script ID to reference"
    required: true
runs:
  using: "composite"
  steps:
    - run: |
        npm install
        echo '${{ inputs.clasprcJson }}' > ~/.clasprc.json
        sed -i '0,/REPLACE_WITH_SCRIPT_ID/s//${{ inputs.scriptId }}/' .clasp.json.template
        mv .clasp.json.template .clasp.json
      shell: sh
