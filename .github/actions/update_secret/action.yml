name: "Update Secret Creds"
description: "Update Secret Creds"
inputs:
  currentCred:
    description: "Current Apps Script Creds"
    required: true
  path:
    description: "Path to Old Creds"
    required: true
  secretName:
    description: "Secret Name"
    required: true
  githubKey:
    description: "Github Auth Key"
    required: true
  repoName:
    description: "Github Repo Name"
    required: true
runs:
  using: "composite"
  steps:
    - run: if [[ $(cmp --silent '${{ inputs.path }}' <<< '${{ inputs.currentCred }}') ]]; then echo 'UPDATE=1' >> $GITHUB_ENV; else echo 'UPDATE=0' >> $GITHUB_ENV; fi
      shell: bash
    - run: node ./.github/actions/update_secret/updateSecret.json '${{ inputs.currentCred }}' '${{ inputs.githubKey }}' '${{ inputs.repoName }}' '${{ inputs.secretName }}'
      if: env.UPDATE == 1
      shell: sh
