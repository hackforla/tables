name: "Replace AppsScript Env"
description: "Replace AppsScript Env"
inputs:
  newEnv:
    description: "Environment variables to replace current Apps Script environment"
    required: true
  confirmation:
    description: "Confirm removing env vars"
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup
      with:
        clasprcJSON: ${{ inputs.newEnv.CLASPRC_JSON }}
        scriptId: ${{ fromJSON(inputs.newEnv.SCRIPT_IDS)["test"] }}
    - run: |
        sudo apt-get update
        sudo apt-get install jq
        npx clasp run setEnv --nodev --params "[\"$(sed 's/\"/\\\"/g' <<< jq -c 'del(.CLASPRC_JSON, .SCRIPT_IDS)' <<< '${{ toJSON(inputs.newEnv) }}')$([ -n "${{ inputs.confirmation }}" ] && echo ', "${{ inputs.confirmation }}"')\"]"
      shell: bash
