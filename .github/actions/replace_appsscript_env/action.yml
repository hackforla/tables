name: "Replace AppsScript Env"
description: "Replace AppsScript Env"
inputs:
  newEnv:
    description: "Environment variables to replace current Apps Script environment"
    required: true
  confirmation:
    description: "Confirm removing env vars"
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup
      with:
        clasprcJSON: ${{ fromJSON(inputs.newEnv).CLASPRC_JSON }}
        scriptId: ${{ fromJSON(fromJSON(inputs.newEnv).SCRIPT_IDS).test }}
    - run: |
        echo '${{ fromJSON(inputs.newEnv).CLASPRC_JSON_RUN }}' > ./.clasprc.json
        echo "[\"$(jq -c 'del(.CLASPRC_JSON, .CLASPRC_JSON_RUN, .SCRIPT_IDS)' <<< '${{ inputs.newEnv }}' | sed 's/\"/\\\"/g')$([ -n "${{ inputs.confirmation }}" ] && echo ', "${{ inputs.confirmation }}"')\"]"
        npx clasp run setEnv --params "[\"$(jq -c 'del(.CLASPRC_JSON, .CLASPRC_JSON_RUN, .SCRIPT_IDS)' <<< '${{ inputs.newEnv }}' | sed 's/\"/\\\"/g')$([ -n "${{ inputs.confirmation }}" ] && echo ', "${{ inputs.confirmation }}"')\"]"
      shell: bash
