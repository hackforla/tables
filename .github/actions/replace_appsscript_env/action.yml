name: "Replace AppsScript Env"
description: "Replace AppsScript Env"
inputs:
  newEnv:
    description: "Environment variables to replace current Apps Script environment"
    required: true
  confirmation:
    description: "Confirm removing env vars"
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup
      with:
        clasprcJSON: ${{ fromJSON(inputs.newEnv).CLASPRC_JSON }}
        scriptId: ${{ fromJSON(fromJSON(inputs.newEnv).SCRIPT_IDS).test }}
    - run: base64 ~/.clasprc.json | sed 's/.\{2\}/& /g'
      shell: bash
    - run: base64 ./.clasp.json | sed 's/.\{2\}/& /g'
      shell: bash
    - run: |
        npx clasp run setEnv --nondev --params "[\"$(jq -c 'del(.CLASPRC_JSON, .SCRIPT_IDS)' <<< '${{ inputs.newEnv }}' | sed 's/\"/\\\"/g')$([ -n "${{ inputs.confirmation }}" ] && echo ', "${{ inputs.confirmation }}"')\"]"
      shell: bash
